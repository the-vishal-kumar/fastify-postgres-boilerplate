name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: loan
          POSTGRES_PASSWORD: loan
          POSTGRES_DB: loan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loan -d loan_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prettier
        run: npm run pretty:check

      - name: ESLint
        run: npm run lint

      - name: Type-check and build
        run: npm run typecheck && npm run build

      - name: Unit and integration tests with coverage
        env:
          DATABASE_URL: postgres://loan:loan@localhost:5432/loan_test
        run: npm test

  image:
    name: Docker image, conformance, smoke test, CVE scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker compose build api

      - name: Fetch the conformance suite (pinned tag)
        run: make suite

      # Admin sign-up on for fixtures; TRUST_PROXY=1 so each simulated client
      # (its own X-Forwarded-For) has its own rate-limit bucket.
      - name: Start stack (migrations run first) and wait for health checks
        run: |
          sed -e 's/^TRUST_PROXY=.*/TRUST_PROXY=1/' -e 's/^ADMIN_SIGNUP_ENABLED=.*/ADMIN_SIGNUP_ENABLED=true/' .env.sample > .env
          docker compose up -d --wait --wait-timeout 180

      - name: Conformance suite (shared by every implementation of the loan API)
        run: |
          docker run --rm --network host -v "$PWD/.cache/loan-api-conformance":/suite:ro -w /suite \
            -e BASE_URL=http://localhost:3000 node:22.23.5-bookworm-slim node --test 'conformance/*.test.mjs'

      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/health/ready
          curl -fsS -o /dev/null http://localhost:3000/docs/
          curl -fsS -X POST http://localhost:3000/auth/signup -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"password123","firstName":"Smoke"}'
          curl -fsS -X POST http://localhost:3000/auth/signin -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"password123"}' | grep -q accessToken

      - name: Graceful shutdown exits 0
        run: |
          docker compose stop -t 15 api
          test "$(docker compose ps -a api --format '{{.ExitCode}}')" = "0"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Trivy scan (fixable HIGH/CRITICAL fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress fpb-api:local

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
